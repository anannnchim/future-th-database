name: Update F1-TH market data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Primary: 03:07 Asia/Bangkok, Monday-Saturday.
    - cron: '7 20 * * 0-5'
    # Fallback: 07:30 Asia/Bangkok, Monday-Saturday.
    - cron: '30 0 * * 1-6'

permissions:
  contents: read
  issues: write

concurrency:
  group: f1-th-market-data
  cancel-in-progress: false

jobs:
  autoscrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas selenium webdriver-manager gspread_dataframe holidays

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Update and verify market-data
        run: |
          for attempt in 1 2 3; do
            echo "Updater attempt ${attempt}/3"
            if python manual-system-f1-th-ver2.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          exit 1

      - name: Verify Automated F1 refresh
        run: python scripts/check_gsheets_dates.py --wait-seconds 600 --poll-seconds 60

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-th-freshness-report
          path: mismatch_report.md
          if-no-files-found: warn

      - name: Open or update failure issue
        if: >-
          failure() &&
          (github.event_name != 'schedule' || github.event.schedule == '30 0 * * 1-6')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Automation] F1-TH data is stale';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('mismatch_report.md')
              ? fs.readFileSync('mismatch_report.md', 'utf8')
              : 'The updater failed before the freshness report was produced.';
            const body = `${report}\n\nWorkflow run: ${runUrl}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Close resolved failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Automation] F1-TH data is stale';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Resolved by workflow run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
