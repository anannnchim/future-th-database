name: Update F1-TH market data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate live inputs and TFEX data without writing Google Sheets"
        required: false
        default: false
        type: boolean
  schedule:
    # Primary: 03:07 Asia/Bangkok, Monday-Saturday. This compensates for
    # observed GitHub scheduling delays while avoiding the top of the hour.
    - cron: '7 20 * * 0-5'
    # Fallback: 07:30 Asia/Bangkok, Monday-Saturday.
    - cron: '30 0 * * 1-6'

permissions:
  contents: read

concurrency:
  group: f1-th-market-data
  cancel-in-progress: false

jobs:
  autoscrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }} 

    - name: Run Automated script
      id: updater
      env:
        DRY_RUN: ${{ inputs.dry_run || 'false' }}
      run: |
        set +e
        if [ "$DRY_RUN" = "true" ]; then
          python manual-system-f1-th-ver2.py --dry-run 2>&1 | tee updater.log
        else
          python manual-system-f1-th-ver2.py 2>&1 | tee updater.log
        fi
        updater_exit=${PIPESTATUS[0]}

        {
          echo "## F1-TH market-data update"
          echo
          echo "| Mode | Result |"
          echo "| --- | --- |"
          if [ "$DRY_RUN" = "true" ]; then
            echo "| Dry run | $([ "$updater_exit" -eq 0 ] && echo 'Passed' || echo 'Failed') |"
          else
            echo "| Live update | $([ "$updater_exit" -eq 0 ] && echo 'Passed' || echo 'Failed') |"
          fi
          echo
          echo "### Per-series results"
          echo '```text'
          grep -E 'DRY RUN validated|sheet updated and verified|ERROR:|All symbols|Update failed' updater.log || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$updater_exit"
