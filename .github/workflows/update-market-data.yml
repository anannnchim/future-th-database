name: Update F1-TH market data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 11:30 Asia/Bangkok, Monday-Saturday. Saturday captures Friday's
    # completed night session without spending five runs per day.
    - cron: '30 4 * * 1-6'

permissions:
  contents: read

concurrency:
  group: f1-th-market-data
  cancel-in-progress: false

jobs:
  autoscrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth pandas selenium webdriver-manager gspread_dataframe

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }} 

    - name: Run Automated script
      run: python manual-system-f1-th-ver2.py
