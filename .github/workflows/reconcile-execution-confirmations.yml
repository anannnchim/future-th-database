name: Reconcile F1-TH execution confirmations

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Reviewed staged trade date (YYYY-MM-DD)"
        required: true
        type: string
      apply:
        description: "Write reviewed values to Execution and Equity"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: f1-th-execution-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      - name: Materialize Gmail OAuth token
        env:
          GMAIL_OAUTH_TOKEN: ${{ secrets.GMAIL_OAUTH_TOKEN }}
        run: |
          test -n "$GMAIL_OAUTH_TOKEN"
          token_file="$RUNNER_TEMP/gmail-oauth-token.json"
          printf '%s' "$GMAIL_OAUTH_TOKEN" > "$token_file"
          chmod 600 "$token_file"
          echo "GMAIL_OAUTH_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
      - name: Reconcile reviewed confirmation
        env:
          F1_TH_PDF_PASSWORD: ${{ secrets.F1_TH_PDF_PASSWORD }}
        run: |
          apply_arg=""
          if [ "${{ inputs.apply }}" = "true" ]; then apply_arg="--apply"; fi
          python scripts/apply_execution_confirmation.py --trade-date "${{ inputs.trade_date }}" $apply_arg
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: f1-th-execution-reconciliation-report
          path: execution_reconciliation_apply_report.md
          if-no-files-found: warn
          retention-days: 30
