name: Stage F1-TH execution confirmations

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trade date to process (YYYY-MM-DD); leave empty for the latest completed TFEX trading date"
        required: false
        type: string
      auto_apply:
        description: "Automatically reconcile a successfully staged confirmation"
        required: false
        default: false
        type: boolean
  schedule:
    # 05:45 and 06:30 Asia/Bangkok, Monday-Saturday. The broker normally
    # sends confirmations around 05:25; both checks finish before the TFEX
    # 08:00 open effective 2026-11-16. GitHub cron is best-effort.
    - cron: '45 22 * * 0-5'
    - cron: '30 23 * * 0-5'

permissions:
  contents: read

concurrency:
  group: f1-th-execution-confirmation-staging
  cancel-in-progress: false

jobs:
  stage-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Authenticate to Google Sheets
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      - name: Materialize Gmail OAuth token
        env:
          GMAIL_OAUTH_TOKEN: ${{ secrets.GMAIL_OAUTH_TOKEN }}
        run: |
          test -n "$GMAIL_OAUTH_TOKEN"
          token_file="$RUNNER_TEMP/gmail-oauth-token.json"
          printf '%s' "$GMAIL_OAUTH_TOKEN" > "$token_file"
          chmod 600 "$token_file"
          echo "GMAIL_OAUTH_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
      - name: Stage broker confirmation
        id: stage
        env:
          F1_TH_PDF_PASSWORD: ${{ secrets.F1_TH_PDF_PASSWORD }}
          TRADE_DATE: ${{ inputs.trade_date || '' }}
        run: |
          python scripts/diagnose_confirmation.py
      - name: Automatically reconcile validated confirmation
        if: steps.stage.outputs.staged == 'true' && (github.event_name == 'schedule' || inputs.auto_apply == true)
        env:
          F1_TH_PDF_PASSWORD: ${{ secrets.F1_TH_PDF_PASSWORD }}
        run: |
          trade_date="${{ inputs.trade_date }}"
          if [ -z "$trade_date" ]; then
            trade_date=$(python -c 'from scripts.trading_calendar import expected_trading_date; print(expected_trading_date())')
          fi
          python scripts/apply_execution_confirmation.py --trade-date "$trade_date" --apply
      - name: Upload staging report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: f1-th-execution-confirmation-intake-report
          path: execution_confirmation_intake_report.md
          if-no-files-found: warn
          retention-days: 30
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v22
        env:
          # GitHub-hosted runners have no usable IPv6 route for Gmail SMTP.
          NODE_OPTIONS: --dns-result-order=ipv4first
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Anan Capital] F1 broker confirmation needs review"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          # Port 465 uses implicit TLS; port 587 upgrades with STARTTLS.
          secure: ${{ secrets.SMTP_PORT == '465' }}
          body: |
            The F1 broker-confirmation staging check needs review.
            See the GitHub Actions report; production sheets were not changed.
          attachments: execution_confirmation_intake_report.md
