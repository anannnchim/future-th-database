name: Validate F1-TH freshness

on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Optional time to wait for Automated F1 recalculation"
        required: false
        default: 0
        type: number
  schedule:
    # 08:30 Asia/Bangkok, after the 07:30 fallback market-data update.
    - cron: '30 1 * * *'

permissions:
  contents: read

concurrency:
  group: f1-th-freshness
  cancel-in-progress: false

jobs:
  check-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Validate end-to-end freshness
        env:
          WAIT_SECONDS: ${{ inputs.wait_seconds || '0' }}
        run: |
          python scripts/check_gsheets_dates.py --wait-seconds "$WAIT_SECONDS"

      - name: Upload mismatch report (always)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: f1-th-freshness-report
          path: mismatch_report.md
          if-no-files-found: warn
          retention-days: 30

      # OPTIONAL: email on mismatch (requires SMTP secrets)
      - name: Send email on mismatch
        if: failure()
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Anan Capital] Google Sheet date mismatch detected"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          secure: true
          body: |
            A date mismatch was detected across symbols.
            See the attached report or the GitHub job logs.
          attachments: mismatch_report.md

