name: Validate F1-TH freshness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas gspread google-auth holidays

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Validate both workbooks
        run: python scripts/check_gsheets_dates.py

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-th-freshness-report
          path: mismatch_report.md
          if-no-files-found: warn
